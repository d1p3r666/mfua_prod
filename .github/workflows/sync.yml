name: Sync Teacher Repository

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout own repository
        uses: actions/checkout@v4

      - name: Download teacher repository
        run: |
          git clone --depth 1 --branch main https://gitflic.ru/project/rurewa/mfua.git /tmp/teacher

      - name: Copy teacher files
        run: |
          rsync -av --delete --exclude=".git" --exclude=".github" /tmp/teacher/ ./

      - name: Push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Sync with teacher repository"
          git push
